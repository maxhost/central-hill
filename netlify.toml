# Netlify config — Next.js (App Router, RSC + ISR) runtime.
# The @netlify/plugin-nextjs runtime turns `next build` output into static assets +
# serverless/edge functions for SSR, ISR, on-demand revalidation and middleware
# (next-intl locale routing). Env vars (DATABASE_URL, BETTER_AUTH_SECRET/URL, …) are
# set in the Netlify UI, not here.

[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
