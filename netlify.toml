# Netlify config — static preview phase (multi-page mock).
# Publish the mock/ folder as the site root so the design preview is self-contained and
# docs/ + CLAUDE.md are NOT exposed on the public domain (they remain in the GitHub repo).
#
# Pages: /home.html (root) · /buildings.html · /building-detail.html  (+ clean aliases below)
#
# NOTE: once the real Next.js app (S0 · platform-foundation) lands, replace this with the
# proper build config:
#   [build] command = "pnpm build"  publish = ".next"   (+ @netlify/plugin-nextjs)

[build]
  publish = "mock"

# Bare URL serves the Home
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200

# Clean aliases
[[redirects]]
  from = "/home"
  to = "/home.html"
  status = 200

[[redirects]]
  from = "/buildings"
  to = "/buildings.html"
  status = 200

[[redirects]]
  from = "/building"
  to = "/building-detail.html"
  status = 200
